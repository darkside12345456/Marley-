[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "0.1.0"
description = "Assistente pessoal inteligente estilo J.A.R.V.I.S. — voz, HUD holográfico, Holo-Lab 3D e cibersegurança, a correr localmente com Ollama."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["flask>=3.0"]

[project.optional-dependencies]
voz = ["SpeechRecognition>=3.10", "pyttsx3>=2.90", "PyAudio>=0.2.13"]
seguranca = ["psutil>=5.9"]
desktop = ["pywebview>=4.0"]
build = ["pyinstaller>=6.0", "pywebview>=4.0"]
# Instala tudo: pip install ".[completo]"
completo = ["SpeechRecognition>=3.10", "pyttsx3>=2.90", "PyAudio>=0.2.13", "psutil>=5.9"]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools]
packages = ["jarvis", "jarvis.tools", "jarvis.web"]

[tool.setuptools.package-data]
"jarvis.web" = ["static/*"]
