<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SONNY</title>
  <link rel="icon" type="image/png" href="/static/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="grid-bg"></div>

  <header class="hud-top">
    <div class="brand">SONNY</div>
    <div class="top-right">
      <div class="clock" id="clock">--:--:--</div>
      <div class="status" id="status">
        <span class="dot" id="dot"></span>
        <span id="statusText">a ligar…</span>
      </div>
    </div>
  </header>

  <main class="stage">
    <!-- Painel lateral: telemetria + arsenal -->
    <aside class="hud-side" id="hudSide">
      <div class="hud-card">
        <div class="hud-card-title">// SISTEMA</div>
        <div class="tele-row"><span>CPU</span><b id="tCpu">—</b></div>
        <div class="tele-bar"><i id="tCpuBar"></i></div>
        <div class="tele-row"><span>MEMÓRIA</span><b id="tRam">—</b></div>
        <div class="tele-bar"><i id="tRamBar"></i></div>
        <div class="tele-row"><span>DISCO</span><b id="tDisk">—</b></div>
        <div class="tele-bar"><i id="tDiskBar"></i></div>
        <div class="tele-row"><span>IP LOCAL</span><b id="tIp">—</b></div>
        <div class="tele-row"><span>ATIVA</span><b id="tUptime">00:00:00</b></div>
      </div>
      <div class="hud-card">
        <div class="hud-card-title">// MÓDULOS</div>
        <ul class="modules" id="modulesList"></ul>
      </div>
      <div class="hud-card">
        <div class="hud-card-title">// ARSENAL</div>
        <ul class="arsenal" id="arsenalList"></ul>
      </div>
    </aside>

    <div class="reactor" id="reactor">
      <canvas id="orb" width="520" height="520"></canvas>
      <div class="state-label" id="stateLabel">EM ESPERA</div>
    </div>

    <!-- Holo-Lab: laboratório 3D holográfico -->
    <div class="holo-lab hidden" id="holoLab">
      <div class="holo-title" id="holoTitle">REATOR ARC</div>
      <canvas id="holoCanvas" width="560" height="560"></canvas>
      <div class="holo-hint">Arrasta para rodar · roda do rato para zoom · no Editor, arrasta as peças</div>
      <div class="holo-controls">
        <select id="holoSelect">
          <option value="reator">Reator Arc</option>
          <option value="capacete">Capacete</option>
          <option value="manopla">Manopla</option>
          <option value="esfera">Núcleo</option>
          <option value="toroide">Anel de energia</option>
          <option value="cilindro">Motor</option>
          <option value="estrutura">Estrutura</option>
        </select>
        <input type="color" id="holoColor" value="#35e6ff" title="Cor da peça" />
        <button id="holoEdit" title="Modo editor: montar cenas">✏️ Editor</button>
        <button id="holoAdd" title="Adicionar a peça selecionada acima">＋</button>
        <button id="holoDup" title="Duplicar a peça selecionada">⧉</button>
        <button id="holoRemove" title="Remover a peça selecionada">🗑</button>
        <button id="holoUndo" title="Desfazer (Ctrl+Z)">↶</button>
        <button id="holoRedo" title="Refazer (Ctrl+Y)">↷</button>
        <button id="holoScaleDown" title="Encolher peça selecionada ( [ )">－🔍</button>
        <button id="holoScaleUp" title="Aumentar peça selecionada ( ] )">＋🔍</button>
        <button id="holoRotY" title="Rodar peça (horizontal)">⟳</button>
        <button id="holoRotX" title="Rodar peça (vertical)">⤵</button>
        <button id="holoSnap" title="Ajustar à grelha (snap)">⊞</button>
        <button id="holoAlign" title="Alinhar todas as peças à grelha">≡</button>
        <button id="holoSave" title="Guardar projeto 3D">💾</button>
        <button id="holoLoad" title="Carregar projeto 3D">📂</button>
        <button id="holoExport" title="Exportar para .obj (impressão 3D)">⬇ .obj</button>
        <button id="holoClose">Fechar</button>
      </div>

      <!-- Galeria de projetos guardados (miniaturas) -->
      <div class="holo-gallery hidden" id="holoGallery">
        <div class="gallery-head">
          <span>Projetos guardados</span>
          <button id="galleryClose">✕</button>
        </div>
        <div class="gallery-grid" id="galleryGrid"></div>
      </div>
    </div>
  </main>

  <section class="transcript" id="transcript"></section>

  <footer class="controls">
    <div class="bar">
      <button id="micBtn" class="mic" title="Falar">
        <span class="mic-icon">🎙️</span>
      </button>
      <input id="textInput" type="text" placeholder="Escreve ou fala com a Sonny…" autocomplete="off" />
      <button id="sendBtn" class="send">Enviar</button>
    </div>
    <div class="tools">
      <button id="settingsBtn" class="reset" title="Definições">⚙️</button>
      <button id="themeBtn" class="reset" title="Mudar tema de cor">🎨</button>
      <button id="wakeBtn" class="reset" title="Palavra de ativação: dizer o nome">🎧</button>
      <button id="labBtn" class="reset" title="Abrir o Holo-Lab (3D)">🔬</button>
      <button id="newsBtn" class="reset" title="Últimas notícias">📰</button>
      <button id="reportBtn" class="reset" title="Relatório de atividade">📋</button>
      <button id="shieldBtn" class="reset" title="Verificar ameaças (cibersegurança)">🛡️</button>
      <button id="resetBtn" class="reset" title="Limpar memória da conversa">⟲</button>
    </div>
  </footer>

  <!-- Painel de definições -->
  <div class="settings hidden" id="settings">
    <div class="settings-head">
      <span>⚙️ Definições</span>
      <button id="settingsClose">✕</button>
    </div>
    <label class="set-row">Voz
      <select id="voiceSel"></select>
    </label>
    <label class="set-row">Velocidade da voz
      <input type="range" id="rateInput" min="0.6" max="1.4" step="0.05" value="1.02" />
    </label>
    <button id="testVoice" class="set-btn">🔊 Testar voz</button>
    <div class="set-row">Tema
      <span class="theme-dots">
        <button class="tdot" data-theme="ciano" style="background:#35e6ff"></button>
        <button class="tdot" data-theme="verde" style="background:#35ffa1"></button>
        <button class="tdot" data-theme="dourado" style="background:#ffd24d"></button>
        <button class="tdot" data-theme="stark" style="background:#ff5a5a"></button>
      </span>
    </div>
    <button id="histBtn" class="set-btn">📈 Histórico de segurança</button>
    <div id="histChart" class="hist-chart"></div>
  </div>

  <script src="/static/hololab.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
