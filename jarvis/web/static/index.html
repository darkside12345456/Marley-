<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>J.A.R.V.I.S.</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="grid-bg"></div>

  <header class="hud-top">
    <div class="brand">J.A.R.V.I.S.</div>
    <div class="status" id="status">
      <span class="dot" id="dot"></span>
      <span id="statusText">a ligar…</span>
    </div>
  </header>

  <main class="stage">
    <div class="reactor" id="reactor">
      <canvas id="orb" width="520" height="520"></canvas>
      <div class="state-label" id="stateLabel">EM ESPERA</div>
    </div>

    <!-- Holo-Lab: laboratório 3D holográfico -->
    <div class="holo-lab hidden" id="holoLab">
      <div class="holo-title" id="holoTitle">REATOR ARC</div>
      <canvas id="holoCanvas" width="560" height="560"></canvas>
      <div class="holo-controls">
        <select id="holoSelect">
          <option value="reator">Reator Arc</option>
          <option value="capacete">Capacete</option>
          <option value="manopla">Manopla</option>
          <option value="esfera">Núcleo</option>
          <option value="toroide">Anel de energia</option>
          <option value="cilindro">Motor</option>
          <option value="estrutura">Estrutura</option>
        </select>
        <button id="holoClose">Fechar</button>
      </div>
    </div>
  </main>

  <section class="transcript" id="transcript"></section>

  <footer class="controls">
    <button id="micBtn" class="mic" title="Falar">
      <span class="mic-icon">🎙️</span>
    </button>
    <input id="textInput" type="text" placeholder="Escreve ou fala com o Jarvis…" autocomplete="off" />
    <button id="sendBtn" class="send">Enviar</button>
    <button id="labBtn" class="reset" title="Abrir o Holo-Lab (3D)">🔬</button>
    <button id="resetBtn" class="reset" title="Limpar memória da conversa">⟲</button>
  </footer>

  <script src="/static/hololab.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
